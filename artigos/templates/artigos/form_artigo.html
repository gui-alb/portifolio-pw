{% extends 'portfolio/base.html' %}

{% block content %}
    <h2>{{ titulo }}</h2>
    
    <form method="post" enctype="multipart/form-data" style="max-width: 600px;">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="margin-top: 20px;">
            <button type="submit" class="btn">Guardar Artigo</button>
            <a href="{% url 'lista_artigos' %}" style="margin-left: 10px;">Cancelar</a>
        </div>
    </form>
{% endblock %}
