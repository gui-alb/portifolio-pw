{% extends 'accounts/base.html' %}

{% block content %}
    <h3>Login</h3>

    <form action="" method="post" >
      {% csrf_token %}
        <p>Username: <input type="text" name="username"></p>
        <p>Password: <input type="password" name="password"></p>
      <input type="submit" value="Entrar">
    </form>
    {% if mensagem %}
        <p style="color: red">{{ mensagem }}</p>
    {% endif %}

{% endblock %}
